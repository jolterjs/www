name: Website / Docs Feature Request
description: Suggest an enhancement, new docs section, or feature for jolter.dev/docs
title: "[Website Feature]: "
labels: ["enhancement", "website"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for suggesting a feature or improvement for the Jolter website!

  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What feature or documentation topic would you like to see added?
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: Problem / Motivation
      description: Why is this feature needed or how would it improve user experience?
    validations:
      required: true

  - type: textarea
    id: context
    attributes:
      label: Additional Context
      description: Attach mockups, references to other docs sites, or details.
    validations:
      required: false
